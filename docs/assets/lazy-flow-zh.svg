<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" width="100%" role="img" aria-labelledby="lazy-zh-title">
  <title id="lazy-zh-title">sessfork 三步懒人使用流程</title>
  <rect width="1040" height="260" rx="20" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="28" y="28" width="308" height="204" rx="16" fill="#131B2E" stroke="#2A3650" stroke-width="1.2"/>
  <rect x="48" y="48" width="96" height="24" rx="12" fill="#0F2034" stroke="#1E4B6E" stroke-width="1"/>
  <text x="96" y="64" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', 'PingFang SC', monospace" font-size="11" font-weight="600">01 · 装一次</text>
  <text x="48" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">一行命令全自动配好</text>
  <text x="48" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">自动检测本机 Antigravity /</text>
  <text x="48" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">Claude Code / Cursor 并装好 Skill。</text>
  <rect x="48" y="160" width="268" height="52" rx="10" fill="#0B0F19" stroke="#24314A" stroke-width="1"/>
  <text x="60" y="182" fill="#22C55E" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11">curl -fsSL .../install.sh | bash</text>
  <text x="60" y="200" fill="#64748B" font-family="'SF Mono', 'PingFang SC', monospace" font-size="10.5"># 纯标准库运行，无需任何 pip 依赖</text>

  <!-- Arrow 1->2 -->
  <line x1="342" y1="130" x2="362" y2="130" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="359,125 367,130 359,135" fill="#38BDF8"/>

  <!-- Step 2 -->
  <rect x="368" y="28" width="308" height="204" rx="16" fill="#131B2E" stroke="#2A3650" stroke-width="1.2"/>
  <rect x="388" y="48" width="96" height="24" rx="12" fill="#0F2034" stroke="#1E4B6E" stroke-width="1"/>
  <text x="436" y="64" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', 'PingFang SC', monospace" font-size="11" font-weight="600">02 · 动动嘴</text>
  <text x="388" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">以后直接跟 AI 说人话</text>
  <text x="388" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">不用记 CLI 参数，需要查哪个</text>
  <text x="388" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">已登录网站，直接复制这句话给 AI。</text>
  <rect x="388" y="160" width="268" height="52" rx="10" fill="#0B0F19" stroke="#24314A" stroke-width="1"/>
  <text x="400" y="182" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">&quot;用 sessfork 帮我在后台悄悄查一下</text>
  <text x="400" y="200" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">github.com 的未读 PR，别抢窗口。&quot;</text>

  <!-- Arrow 2->3 -->
  <line x1="682" y1="130" x2="702" y2="130" stroke="#22C55E" stroke-width="2"/>
  <polygon points="699,125 707,130 699,135" fill="#22C55E"/>

  <!-- Step 3 -->
  <rect x="708" y="28" width="304" height="204" rx="16" fill="#131B2E" stroke="#1E4638" stroke-width="1.2"/>
  <rect x="728" y="48" width="96" height="24" rx="12" fill="#0F2D1E" stroke="#166534" stroke-width="1"/>
  <text x="776" y="64" text-anchor="middle" fill="#86EFAC" font-family="'SF Mono', 'PingFang SC', monospace" font-size="11" font-weight="600">03 · 自动办</text>
  <text x="728" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">后台无头静默搞定</text>
  <text x="728" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">AI 自动同步 Cookies + JWT，</text>
  <text x="728" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12.5">在后台无头浏览器完成操作并汇报。</text>
  <rect x="728" y="160" width="264" height="52" rx="10" fill="#0B1914" stroke="#166534" stroke-width="1"/>
  <circle cx="748" cy="186" r="9" fill="#0F2D1E"/>
  <path d="M743.5 186 L747 189.5 L753 183" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="766" y="183" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">后台已完成并汇报结果</text>
  <text x="766" y="200" fill="#94A3B8" font-family="'SF Mono', 'PingFang SC', monospace" font-size="10.5">0 弹窗打断 · 0600 严格加密保存</text>
</svg>
