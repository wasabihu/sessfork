<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" width="100%" role="img" aria-labelledby="lazy-en-title">
  <title id="lazy-en-title">sessfork 3-Step Lazy Workflow</title>
  <rect width="1040" height="260" rx="20" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="28" y="28" width="308" height="204" rx="16" fill="#131B2E" stroke="#2A3650" stroke-width="1.2"/>
  <rect x="48" y="48" width="88" height="24" rx="12" fill="#0F2034" stroke="#1E4B6E" stroke-width="1"/>
  <text x="92" y="64" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="600">STEP 01</text>
  <text x="48" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700">1-Line Install Once</text>
  <text x="48" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Auto-wires MCP &amp; Agent Skill for</text>
  <text x="48" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Antigravity, Claude Code &amp; Cursor.</text>
  <rect x="48" y="160" width="268" height="52" rx="10" fill="#0B0F19" stroke="#24314A" stroke-width="1"/>
  <text x="60" y="182" fill="#22C55E" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11">curl -fsSL .../install.sh | bash</text>
  <text x="60" y="200" fill="#64748B" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="10.5"># Zero pip dependencies needed</text>

  <!-- Arrow 1->2 -->
  <line x1="342" y1="130" x2="362" y2="130" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="359,125 367,130 359,135" fill="#38BDF8"/>

  <!-- Step 2 -->
  <rect x="368" y="28" width="308" height="204" rx="16" fill="#131B2E" stroke="#2A3650" stroke-width="1.2"/>
  <rect x="388" y="48" width="88" height="24" rx="12" fill="#0F2034" stroke="#1E4B6E" stroke-width="1"/>
  <text x="432" y="64" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="600">STEP 02</text>
  <text x="388" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700">Just Ask Your AI Agent</text>
  <text x="388" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Never touch flags again — ask in</text>
  <text x="388" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">plain English or Chinese anytime.</text>
  <rect x="388" y="160" width="268" height="52" rx="10" fill="#0B0F19" stroke="#24314A" stroke-width="1"/>
  <text x="400" y="182" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">&quot;Use sessfork to check my unread</text>
  <text x="400" y="200" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">PRs on github.com silently.&quot;</text>

  <!-- Arrow 2->3 -->
  <line x1="682" y1="130" x2="702" y2="130" stroke="#22C55E" stroke-width="2"/>
  <polygon points="699,125 707,130 699,135" fill="#22C55E"/>

  <!-- Step 3 -->
  <rect x="708" y="28" width="304" height="204" rx="16" fill="#131B2E" stroke="#1E4638" stroke-width="1.2"/>
  <rect x="728" y="48" width="88" height="24" rx="12" fill="#0F2D1E" stroke="#166534" stroke-width="1"/>
  <text x="772" y="64" text-anchor="middle" fill="#86EFAC" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="600">STEP 03</text>
  <text x="728" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700">Silent Background Work</text>
  <text x="728" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Agent forks Cookies + JWTs and</text>
  <text x="728" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">reports back without stealing focus.</text>
  <rect x="728" y="160" width="264" height="52" rx="10" fill="#0B1914" stroke="#166534" stroke-width="1"/>
  <circle cx="748" cy="186" r="9" fill="#0F2D1E"/>
  <path d="M743.5 186 L747 189.5 L753 183" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="766" y="183" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Done in background</text>
  <text x="766" y="200" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="10.5">0 window switches · 0600 safe</text>
</svg>
