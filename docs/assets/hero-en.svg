  <rect x="564" y="104" width="428" height="72" rx="12" fill="#0D1322" stroke="#2A3650" stroke-width="1"/>
  <circle cx="584" cy="123" r="5" fill="#EF4444"/>
  <circle cx="601" cy="123" r="5" fill="#F59E0B"/>
  <circle cx="618" cy="123" r="5" fill="#22C55E"/>
  <rect x="638" y="113" width="224" height="20" rx="6" fill="#182238"/>
  <text x="650" y="127" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11">docs.company.com (active)</text>
  <rect x="874" y="113" width="104" height="20" rx="10" fill="#0F2D1E" stroke="#166534" stroke-width="1"/>
  <text x="926" y="127" text-anchor="middle" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">100% Yours</text>
  <text x="584" y="159" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">Live Chrome stays untouched — keep reading or coding freely</text>

  <!-- Connector Arrow -->
  <line x1="778" y1="176" x2="778" y2="212" stroke="url(#forkGrad)" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="773,208 783,208 778,216" fill="#22C55E"/>
  <rect x="640" y="182" width="276" height="22" rx="11" fill="#0F2034" stroke="#1E4B6E" stroke-width="1"/>
  <text x="778" y="197" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11">lock-free snapshot -&gt; 0600 state.json</text>

