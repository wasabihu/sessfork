<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="100%" role="img" aria-labelledby="hero-en-title">
  <title id="hero-en-title">sessfork Before vs After Comparison</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="forkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="420" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Card: Without sessfork -->
  <rect x="28" y="24" width="468" height="372" rx="16" fill="#131B2E" stroke="#451A22" stroke-width="1.5"/>
  <rect x="48" y="42" width="176" height="26" rx="13" fill="#3B151B" stroke="#7F1D1D" stroke-width="1"/>
  <text x="136" y="59" text-anchor="middle" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">BEFORE · DIRECT ATTACH</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'IBM Plex Sans', sans-serif" font-size="18" font-weight="700">Foreground Chrome Hijacked</text>

  <!-- Left Browser Mockup -->
  <rect x="48" y="104" width="428" height="172" rx="12" fill="#0D1322" stroke="#2A3650" stroke-width="1"/>
  <rect x="48" y="104" width="428" height="34" rx="12" fill="#182238"/>
  <rect x="48" y="126" width="428" height="12" fill="#182238"/>
  <circle cx="68" cy="121" r="5" fill="#EF4444"/>
  <circle cx="85" cy="121" r="5" fill="#F59E0B"/>
  <circle cx="102" cy="121" r="5" fill="#22C55E"/>
