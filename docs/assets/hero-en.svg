  <rect x="122" y="111" width="92" height="22" rx="6" fill="#0F172A"/>
  <text x="168" y="126" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Your Docs</text>
  <rect x="220" y="111" width="146" height="22" rx="6" fill="#451A22" stroke="#EF4444" stroke-width="1"/>
  <text x="293" y="126" text-anchor="middle" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">AI Switched Tab!</text>

  <!-- Hijack Alert Box inside left browser -->
  <rect x="74" y="158" width="376" height="96" rx="10" fill="#1F1218" stroke="#7F1D1D" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="104" cy="192" r="14" fill="#3B151B"/>
  <path d="M98 186 L110 198 M110 186 L98 198" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <text x="130" y="189" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Window Focus Stolen by Agent</text>
  <text x="130" y="211" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">AI clicks, scrolls &amp; navigates in front of you</text>
  <text x="130" y="233" fill="#64748B" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11">typing_interrupted = true</text>

  <!-- Left Status List -->
  <rect x="48" y="294" width="428" height="38" rx="10" fill="#182032"/>
  <circle cx="70" cy="313" r="9" fill="#3B151B"/>
  <path d="M66 309 L74 317 M74 309 L66 317" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
  <text x="90" y="317" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Steals active window focus &amp; breaks your flow</text>

  <rect x="48" y="342" width="428" height="38" rx="10" fill="#182032"/>
  <circle cx="70" cy="361" r="9" fill="#3B151B"/>
  <path d="M66 357 L74 365 M74 357 L66 365" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
