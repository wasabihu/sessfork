  <rect x="564" y="216" width="428" height="62" rx="12" fill="#0D1924" stroke="#1D4E3E" stroke-width="1"/>
  <rect x="580" y="232" width="30" height="30" rx="8" fill="#0F2D1E" stroke="#22C55E" stroke-width="1"/>
  <path d="M588 242 L594 247 L588 252 M596 252 L603 252" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="622" y="244" fill="#F8FAFC" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="12.5" font-weight="600">sessfork-browser (--headless)</text>
  <text x="622" y="263" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">AI Agent runs silently with forked Cookies + LocalStorage</text>

  <!-- Right Status List -->
  <rect x="564" y="294" width="428" height="38" rx="10" fill="#182032"/>
  <circle cx="586" cy="313" r="9" fill="#0F2D1E"/>
  <path d="M581.5 313 L585 316.5 L591 310" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="606" y="317" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Zero window focus theft, zero tab interruptions</text>

  <rect x="564" y="342" width="428" height="38" rx="10" fill="#182032"/>
  <circle cx="586" cy="361" r="9" fill="#0F2D1E"/>
  <path d="M581.5 361 L585 364.5 L591 358" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="606" y="365" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Domain-scoped allowlist · Pure Python zero dependencies</text>
</svg>
