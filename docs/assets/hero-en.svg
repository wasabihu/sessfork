  <!-- Right Card: With sessfork -->
  <rect x="544" y="24" width="468" height="372" rx="16" fill="#131B2E" stroke="#1E4638" stroke-width="1.5"/>
  <rect x="564" y="42" width="176" height="26" rx="13" fill="#0F2D1E" stroke="#166534" stroke-width="1"/>
  <text x="652" y="59" text-anchor="middle" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">AFTER · WITH SESSFORK</text>
  <text x="564" y="88" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'IBM Plex Sans', sans-serif" font-size="18" font-weight="700">Your Window + Silent Headless Fork</text>

