[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessfork"
version = "0.1.2"
description = "Fork live Chrome auth sessions into headless AI agent browsers (Antigravity, Claude Code, Cursor, Playwright MCP) with zero window focus theft and zero runtime dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Wasabi" }
]
keywords = [
  "ai-agent",
  "mcp",
  "playwright",
  "chrome",
  "cookies",
  "headless-browser",
  "antigravity",
  "claude-code"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wasabihu/sessfork"
Repository = "https://github.com/wasabihu/sessfork"
Issues = "https://github.com/wasabihu/sessfork/issues"

[project.scripts]
sessfork = "sessfork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
