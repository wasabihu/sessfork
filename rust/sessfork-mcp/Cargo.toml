[package]
name = "sessfork-mcp"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Ultra-lightweight native Rust CDP MCP server for sessfork + lexmount/moli (zero Node.js, zero TCP ports via --remote-debugging-pipe)"
repository = "https://github.com/wasabihu/sessfork"

[[bin]]
name = "sessfork-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
