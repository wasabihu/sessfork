[package]
name = "sessfork-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Ultra-lightweight native Rust CDP MCP server for sessfork + lexmount/moli (zero Node.js, zero TCP ports via --remote-debugging-pipe)"
repository = "https://github.com/wasabihu/sessfork"

[[bin]]
name = "sessfork-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
