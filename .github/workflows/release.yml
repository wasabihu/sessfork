name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach prebuilt sessfork-mcp binaries (e.g. v0.1.4)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-rust-mcp:
    name: Build sessfork-mcp (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: sessfork-mcp-darwin-arm64.tar.gz
            archive: tar.gz
            run_tests: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: sessfork-mcp-darwin-x64.tar.gz
            archive: tar.gz
            run_tests: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: sessfork-mcp-linux-x64.tar.gz
            archive: tar.gz
            run_tests: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: sessfork-mcp-linux-arm64.tar.gz
            archive: tar.gz
            run_tests: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sessfork-mcp-windows-x64.zip
            archive: zip
            run_tests: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Run unit tests & clippy (native targets)
        if: ${{ matrix.run_tests }}
        working-directory: rust/sessfork-mcp
        shell: bash
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build stripped release binary (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        working-directory: rust/sessfork-mcp
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" sessfork-mcp
          ls -lh "target/${{ matrix.target }}/release/sessfork-mcp" "dist/${{ matrix.asset }}"
      - name: Build stripped release binary (Windows)
        if: ${{ matrix.archive == 'zip' }}
        working-directory: rust/sessfork-mcp
        shell: pwsh
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target\${{ matrix.target }}\release\sessfork-mcp.exe" -DestinationPath "dist\${{ matrix.asset }}" -Force
          Get-Item "target\${{ matrix.target }}\release\sessfork-mcp.exe", "dist\${{ matrix.asset }}"
      - name: Upload release tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: rust/sessfork-mcp/dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & SHA256SUMS
    needs: [build-rust-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Download all binary tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Package companion Chrome/Edge extension
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          ext_dir = pathlib.Path("extension")
          with zipfile.ZipFile("dist/sessfork-extension.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(ext_dir.rglob("*")):
                  if p.is_file():
                      zf.write(p, p.relative_to(ext_dir).as_posix())
          PY
      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          LC_ALL=C sha256sum sessfork-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Error: Invalid release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber -- dist/sessfork-* dist/SHA256SUMS.txt
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "sessfork ${RELEASE_TAG}" \
              --generate-notes \
              -- \
              dist/sessfork-* \
              dist/SHA256SUMS.txt
          fi

  build-pypi:
    name: Build Python sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject.toml and server.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          tag = os.environ["RELEASE_TAG"]
          py_ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          rust_ver = tomllib.load(open("rust/sessfork-mcp/Cargo.toml", "rb"))["package"]["version"]
          ext_ver = json.load(open("extension/manifest.json", encoding="utf-8"))["version"]
          srv = json.load(open("server.json", encoding="utf-8"))
          assert f"v{py_ver}" == tag, f"pyproject.toml {py_ver} != {tag}"
          assert f"v{rust_ver}" == tag, f"Cargo.toml {rust_ver} != {tag}"
          assert f"v{ext_ver}" == tag, f"extension/manifest.json {ext_ver} != {tag}"
          assert f"v{srv['version']}" == tag, f"server.json {srv['version']} != {tag}"
          assert f"v{srv['packages'][0]['version']}" == tag, f"server.json pkg != {tag}"
          PY
      - name: Build distributions
        run: uv build --out-dir dist-pypi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-dist
          path: dist-pypi/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher)
    needs: [build-pypi, publish-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist-pypi/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-pypi/

  publish-mcp-registry:
    name: Publish to Official MCP Registry
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Wait for PyPI release visibility
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ver="${RELEASE_TAG#v}"
          for i in $(seq 1 12); do
            if curl -fsSL "https://pypi.org/pypi/sessfork/${ver}/json" >/dev/null 2>&1; then
              echo "PyPI sessfork ${ver} is live"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for PyPI sessfork ${ver}" >&2
          exit 1
      - name: Install verified mcp-publisher v1.8.16
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz"
          echo "6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate and publish server.json via GitHub OIDC
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
