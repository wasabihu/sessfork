name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not available on Ubuntu 26.04 runners; pin 24.04 to keep the minimum version tested
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (zero dependencies)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify CLI entrypoint and installer syntax
        run: |
          PYTHONPATH=src python -m sessfork --version
          bash -n install.sh

  rust-mcp:
    name: Rust sessfork-mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run cargo test, clippy, and release build
        working-directory: rust/sessfork-mcp
        shell: bash
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/sessfork-mcp.exe --version
          else
            ./target/release/sessfork-mcp --version
          fi
      - name: Verify PowerShell installer syntax (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install.ps1").Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "install.ps1 AST parse: OK"
